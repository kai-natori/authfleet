# Publish to npm — manual dispatch only (no tag triggers).
#
# Configure npmjs.com package settings → Trusted Publisher for
# kai-natori/authfleet + publish.yml (GitHub Actions; allow npm publish).
# Delete the NPM_TOKEN repository secret after trusted publishing is verified.
# The package must already exist to configure trust: bootstrap the first-ever
# publish with maintainer authentication, then use this workflow for releases.
# See https://docs.npmjs.com/trusted-publishers/ and
# https://docs.npmjs.com/cli/v11/commands/npm-trust/#prerequisites
# OIDC supplies authentication and automatic provenance; no publish token needed.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter authfleet build

      - name: Publish plugin (authfleet)
        working-directory: packages/plugin
        run: npm publish
