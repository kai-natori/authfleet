# Publish to npm — manual dispatch only (no tag triggers).
#
# Releases run from GitHub Actions using the NPM_TOKEN repository secret
# (a granular npm access token with publish rights for `authfleet`,
# with 2FA bypass enabled). This workflow is also how the FIRST publish
# of the package happens: Actions -> "Publish to npm" -> Run workflow.
#
# - plugin: `authfleet` (packages/plugin) — built, then published
#           with provenance (id-token permission below).
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter authfleet build

      - name: Publish plugin (authfleet)
        working-directory: packages/plugin
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
